<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 140" width="100%" height="100%">
  <defs>
    <!-- Ribbon Gold Gradient -->
    <linearGradient id="ribbonGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    
    <!-- Cyan Oval Border Gradient -->
    <linearGradient id="cyanBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BCD4"/>
      <stop offset="50%" stop-color="#0097A7"/>
      <stop offset="100%" stop-color="#00838F"/>
    </linearGradient>

    <!-- Inset Badge Background -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F7FA"/>
    </linearGradient>
    
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Left Ribbon Banner Tail -->
  <polygon points="45,40 15,68 45,96 70,96 70,40" fill="url(#ribbonGold)" stroke="#D97706" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Left Ribbon Fold Shadow -->
  <polygon points="45,40 55,40 45,50" fill="#B45309" opacity="0.4"/>

  <!-- Right Ribbon Banner Tail -->
  <polygon points="295,40 325,68 295,96 270,96 270,40" fill="url(#ribbonGold)" stroke="#D97706" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right Ribbon Fold Shadow -->
  <polygon points="295,40 285,40 295,50" fill="#B45309" opacity="0.4"/>

  <!-- Main Badge Pill / Oval Shape with Filter -->
  <g filter="url(#badgeShadow)">
    <!-- Outer White Buffer Frame -->
    <rect x="42" y="16" width="256" height="104" rx="52" ry="52" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="2"/>

    <!-- Cyan Outer Thick Oval Border -->
    <rect x="46" y="20" width="248" height="96" rx="48" ry="48" fill="url(#badgeBg)" stroke="url(#cyanBorder)" stroke-width="6"/>

    <!-- Cyan Inner Fine Accent Ring -->
    <rect x="54" y="28" width="232" height="80" rx="40" ry="40" fill="none" stroke="#00BCD4" stroke-width="1.8" opacity="0.75"/>
  </g>

  <!-- Decorative subtle damask watermarks in badge header -->
  <path d="M 150 36 C 155 33, 165 33, 170 36 C 167 38, 163 39, 160 41 C 157 39, 153 38, 150 36 Z" fill="#00ACC1" opacity="0.25"/>

  <!-- Brand Typography: Magnify -->
  <text x="160" y="74" font-family="'Outfit', 'Nunito', 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" text-anchor="middle" fill="#E64A19">
    Magnify
  </text>
  <!-- TM symbol -->
  <text x="247" y="52" font-family="'Outfit', Arial, sans-serif" font-size="11" font-weight="800" fill="#E64A19">™</text>

  <!-- 3 Horizontal Parallel Lines (on left below Magnify) -->
  <line x1="78" y1="91" x2="152" y2="91" stroke="#37474F" stroke-width="3" stroke-linecap="round"/>
  <line x1="78" y1="98" x2="152" y2="98" stroke="#37474F" stroke-width="3" stroke-linecap="round"/>
  <line x1="78" y1="105" x2="152" y2="105" stroke="#37474F" stroke-width="3" stroke-linecap="round"/>

  <!-- Subtitle: Grout (on right below Magnify) -->
  <text x="202" y="103" font-family="'Outfit', 'Nunito', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#C2410C">
    Grout
  </text>
</svg>
