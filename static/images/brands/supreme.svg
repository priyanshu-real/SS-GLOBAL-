<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="100%" height="100%">
  <defs>
    <linearGradient id="supremeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E52D27"/>
      <stop offset="100%" stop-color="#B31217"/>
    </linearGradient>
    <linearGradient id="supremeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
  </defs>

  <!-- Supreme Diamond Emblem -->
  <g transform="translate(10, 8)">
    <polygon points="27,2 52,27 27,52 2,27" fill="url(#supremeRed)"/>
    <polygon points="27,8 46,27 27,46 8,27" fill="#FFFFFF" opacity="0.15"/>
    <!-- Stylized 'S' Ribbon in Gold -->
    <path d="M 33 16 C 30 14, 23 15, 21 19 C 19 23, 31 25, 30 31 C 29 36, 21 38, 17 35" fill="none" stroke="url(#supremeGold)" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="74" y="42" font-family="'Outfit', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="1.5" fill="#B31217">
    Supreme
  </text>
  
  <!-- Subtitle: PIPES & FITTINGS -->
  <text x="76" y="58" font-family="'Outfit', 'Montserrat', Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="3.2" fill="#1C1A17">
    PIPES &amp; FITTINGS
  </text>
  <line x1="202" y1="55" x2="265" y2="55" stroke="url(#supremeRed)" stroke-width="2" stroke-linecap="round"/>
</svg>
