<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="100%" height="100%">
  <defs>
    <linearGradient id="carysilBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <linearGradient id="carysilCharcoal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3142"/>
      <stop offset="100%" stop-color="#181A20"/>
    </linearGradient>
  </defs>

  <!-- Carysil Precision Geometry / Sink Basin Emblem -->
  <g transform="translate(10, 9)">
    <rect x="2" y="4" width="46" height="44" rx="8" fill="url(#carysilCharcoal)"/>
    <!-- Inset sink basin bevel -->
    <rect x="8" y="10" width="34" height="32" rx="4" fill="none" stroke="url(#carysilBronze)" stroke-width="2.5"/>
    <!-- Water drain center ring -->
    <circle cx="25" cy="26" r="5" fill="none" stroke="url(#carysilBronze)" stroke-width="2"/>
    <circle cx="25" cy="26" r="2" fill="url(#carysilBronze)"/>
  </g>

  <!-- Typography -->
  <text x="68" y="41" font-family="'Outfit', 'Playfair Display', 'Helvetica Neue', Arial, sans-serif" font-size="33" font-weight="800" letter-spacing="4" fill="#181A20">
    CARYSIL
  </text>

  <!-- Subtitle: GERMAN ENGINEERED QUARTZ SINKS -->
  <text x="70" y="57" font-family="'Outfit', 'Montserrat', Arial, sans-serif" font-size="8.2" font-weight="700" letter-spacing="2.8" fill="#AA771C">
    QUARTZ &amp; GRANITE SINKS
  </text>
  <line x1="218" y1="54" x2="270" y2="54" stroke="url(#carysilBronze)" stroke-width="2" stroke-linecap="round"/>
</svg>
