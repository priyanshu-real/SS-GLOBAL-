<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 70" width="100%" height="100%">
  <defs>
    <linearGradient id="astralBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0082E6"/>
      <stop offset="100%" stop-color="#00529B"/>
    </linearGradient>
    <linearGradient id="astralRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF333A"/>
      <stop offset="100%" stop-color="#D60B12"/>
    </linearGradient>
  </defs>

  <!-- Astral Pipe Flow Icon -->
  <g transform="translate(10, 10)">
    <circle cx="25" cy="25" r="23" fill="url(#astralBlue)"/>
    <!-- Flow loop / interlocking piping ring -->
    <path d="M 14 25 C 14 16, 22 13, 27 15 C 32 17, 36 22, 36 27 C 36 34, 28 37, 23 35 C 18 33, 14 28, 14 25 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="31" cy="18" r="4" fill="url(#astralRed)"/>
  </g>

  <!-- Typography -->
  <text x="68" y="43" font-family="'Outfit', 'Montserrat', Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="2" fill="#00529B">
    ASTRAL
  </text>

  <!-- Red Accent Dot -->
  <circle cx="218" cy="27" r="4.5" fill="url(#astralRed)"/>

  <!-- Subtitle: PIPES -->
  <text x="70" y="58" font-family="'Outfit', 'Montserrat', Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="4.5" fill="#D60B12">
    PIPES
  </text>
  <line x1="126" y1="55" x2="245" y2="55" stroke="url(#astralBlue)" stroke-width="2" stroke-linecap="round"/>
</svg>
