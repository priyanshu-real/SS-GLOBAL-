<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 70" width="100%" height="100%">
  <defs>
    <linearGradient id="princeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0060BA"/>
      <stop offset="100%" stop-color="#003366"/>
    </linearGradient>
    <linearGradient id="princeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Crown / Prince Piping Crest -->
  <g transform="translate(10, 8)">
    <rect x="2" y="2" width="48" height="50" rx="6" fill="url(#princeBlue)"/>
    <!-- Stylized Crown -->
    <path d="M 12 36 L 16 20 L 26 28 L 36 20 L 40 36 Z" fill="url(#princeGold)"/>
    <circle cx="16" cy="18" r="2.5" fill="#FFFFFF"/>
    <circle cx="26" cy="25" r="2.5" fill="#FFFFFF"/>
    <circle cx="36" cy="18" r="2.5" fill="#FFFFFF"/>
    <rect x="12" y="38" width="28" height="4" rx="2" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <text x="70" y="42" font-family="'Outfit', 'Montserrat', Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="2" fill="#003366">
    PRINCE
  </text>

  <!-- Subtitle: PIPES & FITTINGS -->
  <text x="72" y="58" font-family="'Outfit', 'Montserrat', Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="3.5" fill="#D97706">
    PIPES &amp; FITTINGS
  </text>
  <line x1="202" y1="55" x2="258" y2="55" stroke="url(#princeBlue)" stroke-width="2" stroke-linecap="round"/>
</svg>
